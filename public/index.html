<!DOCTYPE html>
<html lang="en" class="i18n-pending">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quick FTP Explorer</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <button type="button" id="skip" class="skip-link" data-i18n="a11y.skip">Skip to the file list</button>
    <h1 class="sr-only">Quick FTP Explorer</h1>

    <header class="topbar">
      <button type="button" id="menu-toggle" class="btn-secondary btn-icon menu-toggle" aria-label="Sites" data-i18n-attr="aria-label: nav.shortcuts" aria-controls="left-pane" aria-expanded="false">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg>
      </button>
      <div class="brand">
        <img class="brand-mark" src="/logo.svg" alt="" width="26" height="26" />
        <span class="brand-name">Quick FTP Explorer</span>
      </div>
      <div class="nav-buttons">
        <button type="button" id="nav-back" class="btn-secondary btn-icon" title="Back (Alt+Left arrow)" aria-label="Back (Alt+Left arrow)" data-i18n-attr="title: nav.back; aria-label: nav.back" disabled>
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.25 8H3m4-4.25L2.75 8 7 12.25"/></svg>
        </button>
        <button type="button" id="nav-forward" class="btn-secondary btn-icon" title="Forward (Alt+Right arrow)" aria-label="Forward (Alt+Right arrow)" data-i18n-attr="title: nav.forward; aria-label: nav.forward" disabled>
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.75 8H13M9 3.75 13.25 8 9 12.25"/></svg>
        </button>
        <button type="button" id="nav-up" class="btn-secondary btn-icon" aria-label="Up" data-i18n-attr="aria-label: nav.upPlain" disabled>
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13.25V3m-4.25 4L8 2.75 12.25 7"/></svg>
        </button>
      </div>
      <nav id="breadcrumb" class="breadcrumb" aria-label="Location" data-i18n-attr="aria-label: nav.current">
        <ol class="bc-list"></ol>
      </nav>
      <button type="button" id="refresh" class="btn-secondary btn-icon" title="Refresh this folder" aria-label="Refresh this folder" data-i18n-attr="title: nav.refresh; aria-label: nav.refresh" disabled>
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.25 8a5.25 5.25 0 1 1-1.54-3.71"/><path d="M13.25 2.5v3h-3"/></svg>
      </button>
      <button type="button" id="search-open" class="btn-secondary btn-icon search-open" aria-label="Search" title="Search" data-i18n-attr="aria-label: search.open; title: search.open">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.25"/><path d="m10.25 10.25 3.5 3.5"/></svg>
      </button>
      <div class="search" role="search">
        <button type="button" id="search-close" class="btn-secondary btn-icon search-close" aria-label="Close search" title="Close search" data-i18n-attr="aria-label: search.close; title: search.close">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.25 8H3m4-4.25L2.75 8 7 12.25"/></svg>
        </button>
        <svg class="icon search-glass" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.25"/><path d="m10.25 10.25 3.5 3.5"/></svg>
        <input type="search" id="search" placeholder="Search all sites" autocomplete="off" aria-label="Search files and folders" title="Search (Ctrl+F)" data-i18n-attr="placeholder: search.allSites; aria-label: search.label; title: search.tip" />
        <button type="button" id="search-clear" class="search-clear" aria-label="Clear search" title="Clear search" data-i18n-attr="aria-label: search.clear; title: search.clear" hidden>
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg>
        </button>
      </div>
    </header>

    <div class="panels">
      <nav id="left-pane" class="pane pane-left" aria-label="Sites" data-i18n-attr="aria-label: nav.shortcuts">
        <div class="pane-header">
          <span class="pane-title" data-i18n="nav.shortcuts">Sites</span>
          <button type="button" id="new-shortcut" class="btn-secondary btn-sm" data-i18n="sc.newButton" hidden>+ New site</button>
        </div>
        <div class="site-find" role="search">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.25"/><path d="m10.25 10.25 3.5 3.5"/></svg>
          <input type="search" id="site-find" autocomplete="off" placeholder="Find a site" aria-label="Find a site" data-i18n-attr="placeholder: nav.findSite; aria-label: nav.findSite" />
          <button type="button" id="site-find-clear" class="search-clear" aria-label="Clear search" title="Clear search" data-i18n-attr="aria-label: search.clear; title: search.clear" hidden>
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg>
          </button>
        </div>
        <ul id="shortcut-list" class="shortcut-list"></ul>
        <p id="empty-hint" class="muted empty-hint" hidden></p>
        <div id="drawer-foot" class="drawer-foot"></div>
      </nav>
      <div id="scrim" class="scrim" hidden></div>

      <div id="splitter" class="splitter" role="separator" aria-orientation="vertical" aria-valuemin="180" aria-valuemax="560" aria-valuenow="280" tabindex="0" aria-label="Resize the site panel" title="Drag, click or use the arrow keys to resize" data-i18n-attr="aria-label: nav.resize; title: nav.resizeTip"></div>

      <main id="right-pane" class="pane pane-right">
        <h2 id="view-title" class="sr-only"></h2>
        <div id="commandbar" class="commandbar" hidden>
          <div class="cmd-group cmd-actions" role="group" aria-label="Actions" data-i18n-attr="aria-label: cmd.actions">
            <button type="button" id="cmd-open" class="btn-secondary" disabled><span class="btn-label" data-i18n="cmd.open">Open</span></button>
            <button type="button" id="cmd-download" class="btn-secondary" disabled><span class="btn-label" data-i18n="cmd.download">Download</span></button>
            <button type="button" id="cmd-link" class="btn-secondary"><span class="btn-label" data-i18n="share.copy">Copy link</span></button>
          </div>
          <div class="cmd-group cmd-sort">
            <label for="sort-select" data-i18n="sort.label">Sort</label>
            <select id="sort-select"></select>
          </div>
          <button type="button" id="filter-open" class="btn-secondary filter-open"><span class="btn-label" data-i18n="filter.group">Filters</span></button>
          <button type="button" id="select-mode" class="btn-secondary btn-icon select-mode" aria-label="Select" title="Select" data-i18n-attr="aria-label: sel.mode; title: sel.mode">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.75 2.75h10.5v10.5H2.75zM5.25 8.25l2 2 3.5-4"/></svg>
          </button>
          <div id="filter-group" class="cmd-group cmd-filters" role="group" aria-label="Filters" data-i18n-attr="aria-label: filter.group">
            <div class="field-inline">
              <label for="f-period" data-i18n="filter.period">Period</label>
              <select id="f-period"></select>
            </div>
            <div class="field-inline" id="f-around" hidden>
              <label for="f-at" data-i18n="filter.at">Time</label>
              <input type="datetime-local" id="f-at" />
              <label for="f-margin" data-i18n="filter.margin">Margin</label>
              <select id="f-margin"></select>
            </div>
            <div class="field-inline" id="f-range" hidden>
              <label for="f-from" data-i18n="filter.from">From</label>
              <input type="datetime-local" id="f-from" />
              <label for="f-to" data-i18n="filter.to">To</label>
              <input type="datetime-local" id="f-to" />
            </div>
            <div class="field-inline" id="f-camera-field" hidden>
              <label for="f-camera" data-i18n="filter.camera">Camera</label>
              <select id="f-camera"></select>
            </div>
            <div class="field-inline" id="f-kind-field" hidden>
              <label for="f-kind" data-i18n="filter.kind">Type</label>
              <select id="f-kind"></select>
            </div>
            <button type="button" id="f-clear" class="btn-secondary" data-i18n="filter.clear" hidden>Clear filters</button>
          </div>
        </div>
        <div id="filter-summary" class="filter-summary" hidden></div>
        <div id="notice" class="notice" role="alert" hidden></div>
        <div id="new-files" class="new-files" hidden></div>
        <div id="results-header" class="search-header" hidden></div>
        <div id="file-list" class="file-list">
          <p class="placeholder muted" data-i18n="common.loading">Loading&hellip;</p>
        </div>
        <div id="selection-bar" class="selection-bar" hidden>
          <button type="button" id="sel-cancel" class="btn-secondary btn-icon" aria-label="Cancel selection" title="Cancel selection" data-i18n-attr="aria-label: sel.cancel; title: sel.cancel">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg>
          </button>
          <span id="sel-count" class="sel-count"></span>
          <button type="button" id="sel-all" class="btn-secondary" data-i18n="menu.selectAll">Select all</button>
          <button type="button" id="sel-link" class="btn-secondary btn-icon"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.75 9.25a2.5 2.5 0 0 0 3.54 0l2.47-2.47a2.5 2.5 0 0 0-3.54-3.54l-.9.9M9.25 6.75a2.5 2.5 0 0 0-3.54 0L3.24 9.22a2.5 2.5 0 0 0 3.54 3.54l.9-.9"/></svg></button>
          <button type="button" id="sel-download" class="btn-icon"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.25v8M4.75 7.25 8 10.5l3.25-3.25M2.75 13.25h10.5"/></svg></button>
        </div>
      </main>
    </div>

    <div id="spinner" class="spinner" hidden>
      <span class="spinner-ring"></span>
      <span class="spinner-text" data-i18n="common.loading">Loading&hellip;</span>
    </div>
    <div id="toast" class="toast" role="alert" hidden></div>

    <footer class="statusbar">
      <span id="status-count" class="muted"></span>
      <span id="status-selection" class="muted"></span>
      <span id="status-updated" class="muted"></span>
      <span id="status-hint" class="status-hint"></span>
      <span class="status-spacer"></span>
      <div id="account" class="account">
        <span id="status-user" class="muted"></span>
        <button type="button" id="accounts-open" class="link-button help-open" hidden><span data-i18n="acc.open">Accounts</span></button>
        <button type="button" id="help-open" class="link-button help-open"><span data-i18n="help.open">Help</span></button>
        <button type="button" id="lang-switch" class="link-button"></button>
        <form method="post" action="/logout">
          <button type="submit" class="link-button" data-i18n="auth.signOut">Sign out</button>
        </form>
      </div>
    </footer>

    <div id="announcer" class="sr-only" role="status"></div>

    <dialog id="help-dialog" class="modal help" aria-labelledby="help-title">
      <h3 id="help-title" data-i18n="help.title">Help</h3>
      <h4 data-i18n="help.findTitle">Find a clip</h4>
      <ol class="help-tips">
        <li data-i18n="help.find1"></li>
        <li data-i18n="help.find2"></li>
        <li data-i18n="help.find3"></li>
      </ol>
      <h4 data-i18n="help.keysTitle">Keyboard shortcuts</h4>
      <table class="help-keys">
        <thead><tr><th scope="col" data-i18n="help.keyCol">Keys</th><th scope="col" data-i18n="help.actionCol">Action</th></tr></thead>
        <tbody id="help-keys"></tbody>
      </table>
      <div class="modal-actions">
        <button type="button" id="help-close" data-i18n="common.close">Close</button>
      </div>
    </dialog>

    <dialog id="link-dialog" class="modal" aria-labelledby="link-dialog-title">
      <h3 id="link-dialog-title" data-i18n="share.dialogTitle">Copy this link</h3>
      <textarea id="link-field" class="link-field" readonly rows="1" aria-labelledby="link-dialog-title"></textarea>
      <p class="field-hint muted" data-i18n="share.dialogHint">Press Ctrl+C to copy it.</p>
      <div class="modal-actions">
        <button type="button" id="link-close" data-i18n="common.close">Close</button>
      </div>
    </dialog>

    <dialog id="filter-sheet" class="sheet" aria-labelledby="filter-sheet-title">
      <h3 id="filter-sheet-title" data-i18n="filter.group">Filters</h3>
      <div class="sheet-body"></div>
      <div class="sheet-actions">
        <button type="button" id="sheet-clear" class="btn-secondary" data-i18n="filter.clear">Clear filters</button>
        <button type="button" id="sheet-show"></button>
      </div>
    </dialog>

    <dialog id="sc-modal" class="modal" aria-labelledby="sc-modal-title">
      <h3 id="sc-modal-title">New site</h3>
      <form id="sc-form">
        <p id="sc-error" class="form-error" role="alert" hidden></p>
        <div class="field">
          <label for="f-username" data-i18n="sc.username">Username</label>
          <input id="f-username" name="username" type="text" required autocomplete="off" />
        </div>
        <div class="field">
          <label for="f-custom"><span data-i18n="sc.custom">Custom label text</span> <span class="muted" data-i18n="common.optional">(optional)</span></label>
          <input id="f-custom" name="customText" type="text" autocomplete="off" placeholder="e.g. Main office NVR" data-i18n-attr="placeholder: sc.customExample" />
        </div>
        <div class="field-row">
          <div class="field">
            <label for="f-host" data-i18n="sc.host">Host</label>
            <input id="f-host" name="host" type="text" required autocomplete="off" />
          </div>
          <div class="field field-port">
            <label for="f-port" data-i18n="sc.port">Port</label>
            <input id="f-port" name="port" type="number" min="1" max="65535" required />
          </div>
        </div>
        <div class="field">
          <label for="f-password" data-i18n="sc.password">Password</label>
          <input id="f-password" name="password" type="text" autocomplete="off" />
          <p id="f-password-hint" class="field-hint muted"></p>
        </div>
        <div class="field muted preview">
          <span data-i18n="sc.preview">Label preview:</span> <span id="f-preview"></span>
        </div>
        <div class="modal-actions">
          <button type="button" id="sc-cancel" class="btn-secondary" data-i18n="common.cancel">Cancel</button>
          <button type="submit" id="sc-save" data-i18n="common.save">Save</button>
        </div>
      </form>
    </dialog>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
